[package]
name = "voicepack"
version = "0.1.0"
edition = "2021"
description = "Record, clip and one-key play voice packs"
license = "MIT"
default-run = "voicepack"

[lib]
name = "voicepack_lib"
path = "src/lib.rs"

[[bin]]
name = "voicepack"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
micdeck_lib = { package = "micdeck", path = "../../micdeck" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
