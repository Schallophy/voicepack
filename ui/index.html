<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>语音包</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" data-icon="wave" aria-hidden="true"></span>
        <div class="brand-text">
          <h1>语音包</h1>
          <span class="session-chip" title="内容只保存在当前会话的内存里，不会自动写盘">数据不出本机 · 不自动保存</span>
        </div>
      </div>
      <div class="seg view-switch" id="viewSwitch" role="tablist" aria-label="视图">
        <button class="seg-btn is-active" data-view="edit" role="tab" aria-selected="true">素材与编辑</button>
        <button class="seg-btn" data-view="board" role="tab" aria-selected="false">语音板</button>
      </div>
      <div class="top-actions">
        <label class="output-field">
          <span>输出</span>
          <select id="outputSelect" aria-label="播放输出设备">
            <option value="">系统默认</option>
          </select>
        </label>
        <button class="icon-btn" id="aboutBtn" data-icon="gear" title="关于" aria-label="关于"></button>
      </div>
    </header>

    <main class="workspace" id="editView">
      <aside class="library" aria-label="素材库">
        <div class="library-head">
          <span class="library-title">素材库</span>
          <span class="count-chip" id="assetCount">0 个</span>
        </div>
        <div class="search-wrap">
          <span class="ic search-ic" data-icon="search" aria-hidden="true"></span>
          <input id="assetSearchInput" type="search" placeholder="搜索素材" autocomplete="off" spellcheck="false" aria-label="搜索素材">
        </div>
        <div class="clip-list" id="assetList" role="listbox" aria-label="素材" tabindex="0">
          <div class="clip-list-inner" id="assetListInner"></div>
        </div>
        <div class="library-foot">
          <button class="btn ghost wide" id="importBtn">
            <span class="ic" data-icon="upload" aria-hidden="true"></span>导入素材
          </button>
        </div>
      </aside>

      <section class="main" aria-label="素材编辑器">
        <div class="recorder" id="recorder">
          <div class="rec-left">
            <div class="seg" id="sourceSeg" role="group" aria-label="录制来源">
              <button class="seg-btn is-active" data-mode="mic">麦克风</button>
              <button class="seg-btn" data-mode="app">应用</button>
              <button class="seg-btn" data-mode="system">系统</button>
            </div>
            <div class="source-picker">
              <select id="micSelect" class="device-select" aria-label="麦克风设备"></select>
              <button class="source-btn hidden" id="appPickBtn">
                <span class="app-mini" id="appMini" aria-hidden="true"></span>
                <span id="appPickLabel">选择应用</span>
              </button>
              <div class="system-hint hidden" id="systemHint">录制时由系统选择共享内容</div>
            </div>
          </div>
          <div class="rec-right">
            <canvas class="rec-meter" id="recMeter" width="264" height="16" aria-hidden="true"></canvas>
            <div class="rec-time hidden" id="recTime">0:00.0</div>
            <button class="record-btn" id="recordBtn">
              <span class="rec-dot" aria-hidden="true"></span>
              <span id="recordLabel">录制</span>
            </button>
          </div>
        </div>

        <div class="editor-card" id="editorCard">
          <div class="editor-toolbar">
            <div class="title-block">
              <input class="clip-title" id="assetTitle" type="text" placeholder="未选择素材" maxlength="60" disabled aria-label="素材名称">
              <div class="clip-meta" id="assetMeta">选择左侧素材开始编辑</div>
            </div>
            <div class="toolbar-actions">
              <button class="btn small" id="trimBtn" disabled title="裁剪到选区">裁剪</button>
              <button class="btn small" id="deleteSelBtn" disabled title="删除选区">删除</button>
              <span class="v-divider"></span>
              <button class="icon-btn" id="undoBtn" data-icon="undo" disabled title="撤销 (Ctrl+Z)" aria-label="撤销"></button>
              <button class="icon-btn" id="redoBtn" data-icon="redo" disabled title="重做 (Ctrl+Shift+Z)" aria-label="重做"></button>
              <span class="v-divider"></span>
              <button class="btn small" id="fitBtn" disabled title="适应窗口">适应</button>
              <button class="icon-btn" id="zoomOutBtn" data-icon="zoomOut" disabled title="缩小" aria-label="缩小"></button>
              <button class="icon-btn" id="zoomInBtn" data-icon="zoomIn" disabled title="放大" aria-label="放大"></button>
              <button class="icon-btn" id="moreBtn" data-icon="more" disabled title="素材操作" aria-label="素材操作"></button>
            </div>
          </div>

          <div class="wave-wrap" id="waveWrap">
            <canvas class="wave-canvas" id="waveCanvas"></canvas>
            <canvas class="overlay-canvas" id="overlayCanvas"></canvas>
            <div class="wave-empty" id="waveEmpty">
              <div class="empty-bars" aria-hidden="true">
                <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
              </div>
              <p>选择左侧素材，或开始录制</p>
            </div>
            <div class="wave-loading hidden" id="waveLoading">正在读取波形…</div>
            <div class="record-overlay hidden" id="recordOverlay">
              <div class="record-head">
                <div class="record-status">
                  <span class="live-dot" aria-hidden="true"></span>
                  <span>正在录制</span>
                  <b id="recSourceName">麦克风</b>
                </div>
                <div class="record-timer" id="recOverlayTime">0:00.0</div>
                <button class="btn subtle small" id="discardBtn">放弃</button>
              </div>
              <canvas class="live-canvas" id="liveCanvas"></canvas>
              <div class="record-foot" id="recHint">再次点击「停止」结束录制</div>
            </div>
            <div class="hscroll hidden" id="hscroll"><div class="hthumb" id="hthumb"></div></div>
          </div>

          <div class="transport">
            <div class="transport-left">
              <button class="play-btn" id="playBtn" data-icon="play" disabled title="播放 (Space)" aria-label="播放"></button>
              <button class="icon-btn" id="stopBtn" data-icon="stop" disabled title="停止" aria-label="停止"></button>
              <button class="icon-btn toggle" id="loopBtn" data-icon="loop" disabled title="循环播放" aria-label="循环播放" aria-pressed="false"></button>
            </div>
            <div class="transport-right">
              <span class="selection-readout" id="selectionReadout"></span>
              <span class="time-readout" id="timeReadout">0:00.000 / 0:00.000</span>
            </div>
          </div>
        </div>

        <div class="inspector" id="inspector">
          <div class="inspector-row fields">
            <label class="field">
              <span>增益</span>
              <span class="input-unit"><input id="gainInput" type="number" step="0.1" min="-24" max="24" value="0" disabled><em>dB</em></span>
            </label>
            <label class="field">
              <span>淡入</span>
              <span class="input-unit"><input id="fadeInInput" type="number" step="10" min="0" max="5000" value="0" disabled><em>ms</em></span>
            </label>
            <label class="field">
              <span>淡出</span>
              <span class="input-unit"><input id="fadeOutInput" type="number" step="10" min="0" max="5000" value="0" disabled><em>ms</em></span>
            </label>
            <label class="field">
              <span>保存到</span>
              <select id="targetPackSelect" class="pack-select" aria-label="保存到语音包" disabled></select>
            </label>
          </div>
          <div class="inspector-row actions">
            <button class="btn small" id="normalizeBtn" disabled>归一化</button>
            <button class="btn small" id="silenceBtn" disabled>去除首尾静音</button>
            <button class="btn small" id="resetBtn" disabled>重置编辑</button>
            <span class="spacer"></span>
            <span class="edit-warning hidden" id="editWarning"></span>
            <button class="btn small" id="exportBtn" disabled>导出素材</button>
            <button class="btn small" id="saveWholeBtn" disabled>保存整段</button>
            <button class="btn primary" id="saveSelBtn" disabled>保存选区</button>
          </div>
        </div>
      </section>
    </main>

    <main class="board-view hidden" id="boardView">
      <div class="board-head">
        <div class="board-pack-row">
          <button class="pack-btn" id="boardPackBtn" aria-haspopup="menu" aria-expanded="false">
            <span class="pack-name" id="boardPackName">默认语音包</span>
            <span class="ic chev" data-icon="chevronDown" aria-hidden="true"></span>
          </button>
          <span class="count-chip" id="boardCount">0 条</span>
        </div>
        <div class="board-tools">
          <div class="search-wrap board-search">
            <span class="ic search-ic" data-icon="search" aria-hidden="true"></span>
            <input id="boardSearch" type="search" placeholder="搜索语音" autocomplete="off" spellcheck="false" aria-label="搜索语音">
          </div>
          <div class="layout-toggle" id="layoutToggle" role="group" aria-label="布局">
            <button class="layout-btn is-active" data-layout="grid" data-icon="grid" title="平铺" aria-label="平铺" aria-pressed="true"></button>
            <button class="layout-btn" data-layout="list" data-icon="listView" title="列表" aria-label="列表" aria-pressed="false"></button>
          </div>
        </div>
      </div>
      <div class="board-body" id="boardBody">
        <div class="voice-grid" id="voiceGrid" role="listbox" aria-label="语音"></div>
        <div class="board-empty hidden" id="boardEmpty">
          <div class="empty-bars" aria-hidden="true">
            <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
          </div>
          <strong id="boardEmptyTitle">这个语音包还没有语音</strong>
          <span id="boardEmptyText">去素材库切好语音后保存进来</span>
          <button class="btn" id="boardEmptyAction">去素材库</button>
        </div>
      </div>
    </main>
  </div>

  <div class="drop-veil hidden" id="dropVeil">
    <div><strong>松开以导入</strong><span>音频文件或语音包</span></div>
  </div>
  <input type="file" id="fileInput" accept="audio/*,.wav,.mp3,.flac,.ogg,.m4a,.aac,.webm" multiple hidden>
  <input type="file" id="packInput" accept=".zip,.voicepack,application/zip" hidden>
  <div id="modalRoot"></div>
  <div id="toastRoot" aria-live="polite" aria-atomic="false"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
